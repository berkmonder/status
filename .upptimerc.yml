# Upptime: https://upptime.js.org/docs/configuration. GitHub runs the checks every 5 minutes and keeps
# the history here; berkmonder.com/status shows it (Upptime's own status website is retired:
# status.berkmonder.com redirects there, from the gh-pages branch). Made by nix-dotfiles' scripts/status-setup.
owner: berkmonder
repo: status
sites:
  - name: berkmonder.com
    url: https://berkmonder.com
    maxResponseTime: 3000
  - name: Turquoise API
    url: https://berkmonder.com/api/health
    maxResponseTime: 3000
